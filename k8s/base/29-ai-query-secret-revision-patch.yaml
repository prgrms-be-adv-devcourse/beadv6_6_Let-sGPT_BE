apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai
  namespace: openat
spec:
  template:
    metadata:
      annotations:
        # seed 값. CD가 deploy/state에서 ai-query-secrets resourceVersion으로 갱신하며,
        # 값이 바뀌면 pod template이 달라져 조회 자격증명 회전 시 파드가 재시작된다.
        openat.io/ai-query-secret-revision: "bootstrap"
