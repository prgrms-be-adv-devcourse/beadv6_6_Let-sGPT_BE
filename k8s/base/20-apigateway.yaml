# ★ S2: startup/readiness/liveness probe (actuator probes — replica>1 롤링 무유실의 전제)
# ★ S5: prometheus.io/* 어노테이션 (7/10 Prometheus 구축 시 재배포 없이 scrape 대상 편입)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apigateway
  namespace: openat
spec:
  replicas: 1
  # 단일 워커 노드: 롤링 시 옛+새 파드 2배 메모리로 Insufficient memory Pending(Q80 #7) 방지.
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
  selector:
    matchLabels: { app: apigateway }
  template:
    metadata:
      labels: { app: apigateway }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: apigateway
          image: ghcr.io/prgrms-be-adv-devcourse/beadv6_6_let-sgpt_be/apigateway:latest
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: app-config }
          env:
            # limit 512Mi 내 결정론적 배분: 힙 50%(<=256Mi) + 다이렉트 96m + codecache 64m
            # + 메타스페이스(무캡, 실측 상한 ~60Mi) + 스택/네이티브 ~35Mi ≒ 511Mi.
            # MaxDirectMemorySize 명시 이유: 미지정 시 기본값이 최대 힙(≈256Mi)과 같아
            # 힙+다이렉트만으로 limit에 도달 → 스파이크 시 Netty 버퍼 적체로 OOMKilled(exit137).
            - { name: JAVA_TOOL_OPTIONS, value: "-XX:MaxRAMPercentage=50.0 -XX:InitialRAMPercentage=25.0 -XX:MaxDirectMemorySize=96m -XX:ReservedCodeCacheSize=64m" }
            - { name: MALLOC_ARENA_MAX, value: "2" }
          # 기동 완료까지 최대 300초 유예(2vCPU에서 6개 JVM 동시 부팅 + kubelet/kube 예약 감안, 실측 최악 251s) — 이후 liveness로 전환. k3s_node_coldboot_contention_plan §2-B/§2-A 동시 적용 전제
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8000 }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8000 }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8000 }
            periodSeconds: 10
            timeoutSeconds: 3    # k3s_memory_mitigation_plan §4(WS-M3) — GC pause/CPU 기아 오탐 흡수
            failureThreshold: 5  # 3→5, kill 유예 30s→50s
          resources:
            limits: { memory: "512Mi" }   # 320Mi→512Mi: 스파이크 시 다이렉트 메모리 적체로 OOMKilled(exit137) 방어. 힙+다이렉트+메타스페이스 명시 배분 수렴
            requests: { cpu: "300m", memory: "320Mi" }   # 256Mi→320Mi: 스파이크 정점 RSS 313Mi 커버(노드 request 합 여유 ~2.2Gi 내 소폭 상향). cpu 300m 유지
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: apigateway
  namespace: openat
spec:
  selector: { app: apigateway }
  ports: [{ port: 8000, targetPort: 8000 }]
