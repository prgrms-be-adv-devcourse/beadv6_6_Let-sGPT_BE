# 배포 직후 JVM 웜업 — ArgoCD PostSync 훅 Job.
#
# 이 인프라는 SSM 전용 접근이라 로컬 kubectl/port-forward가 불가능하다. 그래서
# scripts/warmup.sh를 사람이 밖에서 돌리는 대신, 클러스터 안에서 apigateway를
# 직접 호출하는 Job으로 실행한다(BASE_URL=http://apigateway.openat:8000).
#
# 이미지는 apigateway 것을 그대로 재사용한다. 노드에 이미 pull돼 있어 추가 pull이
# 없고, temurin(Ubuntu) 베이스라 bash/curl/awk/coreutils가 전부 들어있다. 이미지
# 이름 기준으로 overlay의 images 트랜스포머가 배포 태그를 자동 치환한다.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: warmup-config
data:
  # 클러스터 내부에서는 Service DNS 직접 호출 — port-forward 불필요.
  BASE_URL: "http://apigateway.openat:8000"
  ITERATIONS: "150"
  CONCURRENCY: "4"
  WINDOW: "20"
  # 단계적 활성화: 테스트 계정 시드 + warmup-secrets 준비 확인 후 "1"로 바꾼다(이미지 재빌드 없음).
  # 0인 동안은 AUTH_TOKEN이 비면 order-list를 SKIP(경고만) — 배포는 성공.
  REQUIRE_AUTH: "0"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: warmup
  annotations:
    # Sync 단계의 모든 리소스가 Healthy(=rollout 완료, ready)가 된 뒤 실행된다.
    # ready한 JVM이 곧 warm한 JVM은 아니라는 간극이 이 웜업이 노리는 지점.
    argocd.argoproj.io/hook: PostSync
    # 이 방식의 산출물은 로그의 plateau 숫자(초기 p95 → 마지막 p95)다. HookSucceeded면
    # 성공하는 순간 파드가 지워져 로그도 사라진다. BeforeHookCreation은 다음 sync가
    # 새 훅을 만들 때 직전 것을 지우므로 직전 배포의 웜업 로그가 항상 남는다.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  # 첫 실행이 이미 JVM을 데워놓아 재시도는 거의 항상 통과 = plateau 신호를 무의미하게 만들고
  # 첫 실행의 실패 사실만 가린다. 재시도하지 않는다.
  backoffLimit: 0
  # 기대 소요 2~4분. 멈춘 웜업이 Application을 Progressing으로 무한정 붙잡는 것을 막는다.
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels: { app: warmup }
    spec:
      restartPolicy: Never   # OnFailure는 같은 파드에서 재시작해 이전 로그를 덮는다 — 진단 목적이라 Never.
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: warmup
          image: ghcr.io/prgrms-be-adv-devcourse/beadv6_6_let-sgpt_be/apigateway:latest
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -eu
              # 로그인은 웜업 루프가 아니라 여기서 1회만 — 매 실행 신선한 토큰이라 만료 문제가
              # 구조적으로 사라진다. 비밀번호를 다루므로 set -x 는 절대 켜지 않고, 요청 바디·응답
              # 본문을 로그로 출력하지 않는다.
              #
              # 실패 정책: 웜업(캐시 예열=최적화)이 배포 성공을 인질로 잡지 않게 한다. 이 컨테이너의
              # 실패 경로는 두 단계 — (1) 로그인 단계, (2) 웜업 스크립트 실행 단계 — 이고, 두 단계
              # 모두 같은 정책 함수를 통과한다.
              #   - WARMUP_STRICT=false(기본): 두 단계 중 어디서 실패하든 크게 로깅하고 exit 0(배포 비차단).
              #   - WARMUP_STRICT=true: 실패한 단계의 종료 코드로 exit(배포 실패).
              #   - 로그인 중 재시도로 풀릴 수 없는 자격증명/요청 오류(400/401/403 등)는 즉시 포기.
              #   - 로그인 중 연결 실패·타임아웃·5xx 등 일시 오류만 5초 간격 3회 자체 재시도.
              WARMUP_STRICT="${WARMUP_STRICT:-false}"

              # 실패 단계·종류를 구분해 크게 로깅한 뒤, strict 여부로 exit 코드를 결정한다.
              # 사용법: apply_failure_policy <kind> [exit_code]  (exit_code 기본 1)
              #   credential : [로그인] 재시도 불가 자격증명/요청 오류.
              #   transient  : [로그인] 재시도 후에도 남은 게이트웨이 연결/5xx 오류.
              #   script     : [웜업 실행] 로그인은 통과했으나 warmup.sh 가 비정상 종료.
              apply_failure_policy() {
                fail_kind="$1"
                fail_code="${2:-1}"
                case "$fail_kind" in
                  credential)
                    echo "ERROR: [로그인 단계] 웜업 자격증명 오류 — 재시도로 풀 수 없습니다. warmup-secrets 시크릿의 웜업 계정(WARMUP_EMAIL/WARMUP_PASSWORD)과 로그인 라우트를 확인하세요." >&2
                    ;;
                  transient)
                    echo "ERROR: [로그인 단계] 웜업 게이트웨이 연결 실패 — 연결 실패/타임아웃/5xx가 재시도 후에도 지속(일시 오류 가능). apigateway 상태를 확인하세요." >&2
                    ;;
                  script)
                    echo "ERROR: [웜업 실행 단계] warmup.sh 가 비정상 종료(exit=${fail_code}) — 로그인/토큰 확보는 통과했고 웜업 호출 루프에서 실패했습니다. 위 warmup.sh 로그(대상별 2xx 건수·p95)를 확인하세요." >&2
                    ;;
                  *)
                    echo "ERROR: [알 수 없는 단계] 웜업 실패(kind=${fail_kind}, exit=${fail_code})." >&2
                    ;;
                esac
                if [ "$WARMUP_STRICT" = "true" ]; then
                  echo "ERROR: WARMUP_STRICT=true — 웜업 실패를 배포 실패로 처리합니다(exit ${fail_code})." >&2
                  exit "$fail_code"
                fi
                echo "WARN: WARMUP_STRICT=false — 웜업 실패를 배포 비차단으로 처리합니다(exit 0). 위 로그를 확인하세요." >&2
                exit 0
              }

              if [ -n "${WARMUP_EMAIL:-}" ] && [ -n "${WARMUP_PASSWORD:-}" ]; then
                BODY=$(printf '{"email":"%s","password":"%s"}' "$WARMUP_EMAIL" "$WARMUP_PASSWORD")
                BODY_FILE="$(mktemp /tmp/warmup-login.XXXXXX)"
                trap 'rm -f "$BODY_FILE"' EXIT

                AUTH_TOKEN=""
                attempt=1
                max_attempts=4   # 최초 1회 + 일시 오류 재시도 3회.
                while : ; do
                  # -f 미사용: 4xx/5xx도 응답으로 받아 HTTP 상태코드로 분기. 본문은 파일로만 받는다.
                  http_code=$(curl -s -o "$BODY_FILE" -w '%{http_code}' \
                                   --connect-timeout 5 --max-time 15 \
                                   -X POST "$BASE_URL/api/v1/members/login" \
                                   -H 'Content-Type: application/json' -d "$BODY") && rc=0 || rc=$?

                  if [ "$rc" -ne 0 ]; then
                    kind="transient"   # 연결 실패/타임아웃(curl 7/28 등) — 응답 없음(http=000).
                  elif printf '%s' "$http_code" | grep -q '^2'; then
                    AUTH_TOKEN=$(grep -o '"accessToken":"[^"]*"' "$BODY_FILE" | head -1 | cut -d'"' -f4)
                    if [ -n "$AUTH_TOKEN" ]; then
                      break   # 성공 — 토큰 확보.
                    fi
                    kind="credential"  # 2xx인데 토큰 없음 — 응답 계약/계정 문제, 재시도 무의미.
                  elif printf '%s' "$http_code" | grep -q '^5'; then
                    kind="transient"   # 5xx — 일시 오류 가능.
                  else
                    kind="credential"  # 400/401/403 등 — 재시도로 풀리지 않는 오류.
                  fi

                  if [ "$kind" = "credential" ]; then
                    echo "WARN: 웜업 로그인 실패(비재시도, http=${http_code}, curl_rc=${rc})." >&2
                    apply_failure_policy credential
                  fi

                  if [ "$attempt" -ge "$max_attempts" ]; then
                    echo "WARN: 웜업 로그인 일시 오류 — 재시도 소진(http=${http_code}, curl_rc=${rc})." >&2
                    apply_failure_policy transient
                  fi
                  echo "WARN: 웜업 로그인 일시 오류(http=${http_code}, curl_rc=${rc}) — 시도 ${attempt}/${max_attempts}, 5초 후 재시도." >&2
                  attempt=$((attempt + 1))
                  sleep 5
                done

                rm -f "$BODY_FILE"
                trap - EXIT
                # 토큰은 환경변수로만 넘긴다 — 인자로 주면 ps/로그에 노출된다. 값은 출력하지 않는다.
                export AUTH_TOKEN
                echo "INFO: [로그인 단계] 웜업 토큰 확보 완료(값은 로깅하지 않음)."
              fi

              # exec 를 쓰지 않는다 — exec 하면 warmup.sh 의 종료 코드가 그대로 컨테이너 종료 코드가
              # 되어 WARMUP_STRICT=false 여도 웜업 실패가 배포를 막는다. 종료 코드를 받아 로그인
              # 실패와 동일한 정책을 적용한다. (set -e 아래이므로 || 로 errexit 를 비켜간다.)
              warmup_rc=0
              bash /warmup/warmup.sh || warmup_rc=$?
              if [ "$warmup_rc" -ne 0 ]; then
                apply_failure_policy script "$warmup_rc"
              fi
              echo "INFO: [웜업 실행 단계] warmup.sh 정상 종료 — 웜업 완료."
          env:
            # 웜업 실패 정책 스위치. "false"(기본)면 로그인/토큰 실패와 warmup.sh 비정상 종료를
            # 모두 크게 로깅하되 배포를 막지 않는다(exit 0). 운영에서 웜업 실패를 배포 실패로
            # 강제하려면 이 값만 "true"로 바꾼다(이미지 재빌드 없음).
            - name: WARMUP_STRICT
              value: "false"
          envFrom:
            - configMapRef: { name: warmup-config }
            - secretRef: { name: warmup-secrets, optional: true }   # 미준비 상태 배포 허용(단계적 활성화)
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
          resources:
            requests: { memory: "32Mi" }
            limits: { memory: "96Mi" }   # CPU limit 미설정 — 전 서비스 공통 정책.
          volumeMounts:
            - { name: script, mountPath: /warmup, readOnly: true }
            - { name: tmp, mountPath: /tmp }   # readOnlyRootFilesystem 하에서 mktemp -d 대상.
      volumes:
        - name: script
          configMap:
            name: warmup-script   # 해시 접미사 이름은 kustomize가 치환.
            defaultMode: 0444      # 실행 비트에 의존하지 않고 bash 로 명시 호출.
        - name: tmp
          emptyDir: {}
