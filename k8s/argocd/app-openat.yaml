# openat 앱 Application CR. targetRevision=deploy/state — CD(deploy.yml)가 이미지 SHA를
# 커밋백하는 그 브랜치(GitOps desired-state 단일 출처). repo가 PUBLIC이라 자격증명 불필요.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openat
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/prgrms-be-adv-devcourse/beadv6_6_Let-sGPT_BE
    targetRevision: deploy/state
    # 부하테스트 오버레이 활성 상태(2026-07-28 켜짐). 목·커넥션풀·유량제한이 git desired-state로
    # 강제된다. 비활성화 = 이 커밋 revert(path를 k8s/overlay로 복귀, prune이 wiremock 철거).
    # 절차·검증은 k8s/overlay-loadtest/README.md 참고.
    path: k8s/overlay-loadtest
  destination:
    server: https://kubernetes.default.svc
    namespace: openat
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=false]
