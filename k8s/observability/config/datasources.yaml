apiVersion: 1
datasources:
  # uid 고정 — 대시보드 JSON이 datasource를 uid로 참조(prometheus/tempo). 미지정 시 랜덤 uid가
  # 배정되어 프로비저닝 대시보드의 datasource 참조가 깨진다. 기존 name 참조("Prometheus")도 계속 유효.
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: "http://prometheus:9090"
    isDefault: true
    jsonData:
      # 히스토그램 버킷 exemplar의 trace id 라벨(Micrometer 기본 trace_id)을 Tempo 데이터소스로 연결한다.
      # 지연 패널의 exemplar 점을 클릭하면 해당 trace_id로 Tempo 트레이스가 열린다.
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: "http://tempo:3200"
