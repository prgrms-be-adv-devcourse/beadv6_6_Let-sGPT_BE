receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"
  prometheus:
    config:
      global:
        scrape_interval: 30s        # gate2 A-1: 수신량·staleness 메모리 절반 (인프라 대시보드 30s 해상도 충분)
      scrape_configs:
        - job_name: kubernetes-pods
          kubernetes_sd_configs:
            - role: pod
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
              action: keep
              regex: "true"
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
              action: replace
              target_label: __metrics_path__
              regex: (.+)
            - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
              action: replace
              regex: ([^:]+)(?::\d+)?;(\d+)
              replacement: $1:$2
              target_label: __address__
            - source_labels: [__meta_kubernetes_namespace]
              target_label: namespace
            - source_labels: [__meta_kubernetes_pod_label_app]
              target_label: app
            # 파드 단위 드릴다운용 — instance(IP:포트)는 사람이 못 읽어서 pod명을 라벨로.
            - source_labels: [__meta_kubernetes_pod_name]
              target_label: pod
          metric_relabel_configs:
            # cert-manager 네임스페이스 전량 드롭 — 대시보드 참조 0건, 실측 712~975 시리즈.
            # 인증서 만료는 패널이 아니라 cert-manager 이벤트/로그로 본다.
            - source_labels: [namespace]
              regex: cert-manager
              action: drop
            # kube-system(traefik) 전량 드롭 — 대시보드 참조 0건, 실측 48~356 시리즈.
            - source_labels: [namespace]
              regex: kube-system
              action: drop
            # postgres-exporter는 1,702 시리즈를 내보내는데 대시보드가 쓰는 건 8개 이름 30 시리즈뿐.
            # RE2에 부정 전방탐색이 없어 "허용 표시 후 미표시분 드롭" 2단 구성으로 처리한다.
            - source_labels: [__name__]
              regex: pg_up|pg_database_size_bytes|pg_stat_activity_count|pg_stat_database_deadlocks|pg_stat_database_tup_fetched|pg_stat_database_tup_returned|pg_stat_database_xact_commit|pg_stat_database_xact_rollback
              target_label: __tmp_pg_keep
              replacement: "yes"
            - source_labels: [__name__, __tmp_pg_keep]
              regex: pg_.*;
              action: drop
        # k3s kubelet 내장 cAdvisor — 별도 파드 없이 컨테이너별 메모리/CPU 확보.
        # Prometheus 288Mi 보호를 위해 keep 필터로 시리즈 최소화.
        - job_name: kubernetes-cadvisor
          scheme: https
          tls_config:
            insecure_skip_verify: true
          authorization:
            credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
          kubernetes_sd_configs:
            - role: node
          relabel_configs:
            - source_labels: [__meta_kubernetes_node_name]
              target_label: node
            - target_label: __metrics_path__
              replacement: /metrics/cadvisor
          metric_relabel_configs:
            # 카디널리티 방어 — 필요한 시리즈만 keep
            - source_labels: [__name__]
              regex: container_memory_working_set_bytes|container_cpu_usage_seconds_total|container_spec_memory_limit_bytes|container_cpu_cfs_throttled_periods_total|container_cpu_cfs_periods_total|machine_memory_bytes
              action: keep
            # 파드 아닌 cgroup 중간노드(빈 pod 라벨) 제거. 단 machine_*는 pod 라벨이 없으므로 예외 통과.
            - source_labels: [__name__, pod]
              regex: "machine_.*;|[^;]*;.+"
              action: keep
        # 노드 PSI 전용 node-exporter(12-node-exporter.yaml). 사용률로는 안 보이는 "자원을 못
        # 얻어 멈춰 있던 시간"을 잡는다(실측: 노드 CPU 32%일 때 cpu some avg10 96%).
        #
        # 공용 kubernetes-pods 잡에 어노테이션으로 태우지 않고 전용 잡을 판 이유 세 가지.
        #  1) 카디널리티. 공용 잡의 metric_relabel_configs는 모든 앱 파드에 함께 걸려서
        #     node_pressure_* 만 남기는 단순 keep을 쓸 수 없다. postgres-exporter처럼
        #     "허용 표시 후 미표시분 드롭" 2단 우회를 또 만들어야 하는데, 전용 잡이면
        #     keep 한 줄로 끝난다.
        #  2) node 라벨. PSI는 노드 단위 값이라 node 라벨이 필수인데, 공용 잡에 node
        #     relabel을 넣으면 전 앱 시리즈에 node 라벨이 붙어 시리즈가 통째로 늘어난다.
        #  3) 선례. 같은 이유로 kubernetes-cadvisor도 이미 별도 잡으로 분리돼 있다.
        - job_name: node-exporter
          kubernetes_sd_configs:
            - role: pod
          relabel_configs:
            - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_pod_label_app]
              action: keep
              regex: observability;node-exporter
            # PSI 값의 주인은 파드가 아니라 노드다. 대시보드 범례도 node 기준.
            - source_labels: [__meta_kubernetes_pod_node_name]
              target_label: node
            - source_labels: [__meta_kubernetes_pod_name]
              target_label: pod
          metric_relabel_configs:
            # 카디널리티 방어 — exporter를 최소 구성으로 띄웠어도 keep으로 한 번 더 거른다.
            # node_pressure_* 는 {cpu,io,memory}×{waiting(some),stalled(full)} 6종 + 커널
            # 버전에 따라 irq_stalled. 노드당 6~7시리즈, 두 노드 합쳐 12~14시리즈다.
            # up은 스크레이프 루프가 metric_relabel 이후에 붙이는 합성 시리즈라 사실 이 필터를
            # 타지 않지만, "PSI 0"과 "수집기 죽음"을 구분하려면 반드시 남아야 하는 시리즈라
            # 의도를 명시해 둔다(나중에 이 정규식을 좁힐 때 실수로 죽이지 않도록).
            - source_labels: [__name__]
              regex: node_pressure_.*|up
              action: keep
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400        # tail_sampling 버퍼링 상향: resources.limits.memory(512Mi)−112Mi(Go 비힙 쿠션). OOMKill 전 스스로 드롭
    spike_limit_mib: 100  # soft=300, hard=400
  # 헬스/프로브 노이즈 스팬 드롭 — 속성 없으면 무시(ignore)해 크래시 방지.
  filter/noise:
    error_mode: ignore
    traces:
      span:
        - 'attributes["http.target"] != nil and IsMatch(attributes["http.target"], "(/actuator|/health|/readiness|/liveness)")'
        - 'attributes["http.route"] != nil and IsMatch(attributes["http.route"], "(/actuator|/health|/readiness|/liveness)")'
        - 'attributes["url.path"] != nil and IsMatch(attributes["url.path"], "(/actuator|/health|/readiness|/liveness)")'
        - 'attributes["http.url"] != nil and IsMatch(attributes["http.url"], "(/actuator|/health|/readiness|/liveness)")'
        - 'IsMatch(name, "(/actuator|/health|/readiness|/liveness)")'
  # 최소 PII 스크럽 — db.statement 삭제 + URL 쿼리스트링(? 이후) 제거.
  transform/scrub:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - delete_key(attributes, "db.statement")
          - replace_pattern(attributes["http.url"], "[?].*", "")
          - replace_pattern(attributes["url.full"], "[?].*", "")
  # 파드/네임스페이스/노드/디플로이먼트 메타 부착. pod.uid(resource) 우선, 없으면 IP(connection)로 연결.
  k8sattributes:
    passthrough: false
    extract:
      metadata:
        - k8s.pod.name
        - k8s.namespace.name
        - k8s.node.name
        - k8s.deployment.name
        - k8s.pod.uid
      labels:
        # 카디널리티 방어 — pod-template-hash(롤아웃마다 무한 증가) 등 catch-all 라벨 추출 제거.
        # app 라벨만 부착(나머지 catch-all 및 annotations 전체 드롭).
        - { tag_name: k8s.pod.label.app, key: app, from: pod }
    pod_association:
      - sources:
          - { from: resource_attribute, name: k8s.pod.uid }
      - sources:
          - { from: connection }
  # tail 샘플링 — 에러/5xx/느린(>2s) 트레이스 100%, 나머지는 확률 폴백(기본 5%).
  # 정책은 OR 결합: 하나라도 sample이면 트레이스 유지.
  tail_sampling:
    decision_wait: 10s
    num_traces: 50000
    expected_new_traces_per_sec: 100
    policies:
      - name: errors
        type: status_code
        status_code: { status_codes: [ERROR] }
      - name: http-5xx
        type: numeric_attribute
        numeric_attribute: { key: http.response.status_code, min_value: 500 }
      - name: slow
        type: latency
        latency: { threshold_ms: 2000 }
      - name: fallback-probabilistic
        type: probabilistic
        probabilistic:
          sampling_percentage: ${env:OTEL_TAIL_SAMPLING_PERCENT:-5}
  batch:
    timeout: 5s
    send_batch_size: 1024
  resource:
    attributes:
      - { key: k8s.cluster.name, value: "openat-k3s", action: upsert }
      - { key: deployment.environment, value: "production", action: upsert }
exporters:
  otlp/tempo:
    endpoint: "tempo.observability.svc.cluster.local:4317"
    tls:
      insecure: true
  prometheusremotewrite:
    endpoint: "http://prometheus.observability.svc.cluster.local:9090/api/v1/write"
    tls:
      insecure: true
extensions:
  health_check:
    endpoint: "0.0.0.0:13133"
service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/noise, transform/scrub, k8sattributes, tail_sampling, batch, resource]
      exporters: [otlp/tempo]
    metrics:
      receivers: [prometheus]
      processors: [memory_limiter, batch, resource]
      exporters: [prometheusremotewrite]
