  # Redis 관측 — 드롭 커머스의 진실 원장(대기열·입장권·재고 선점). noeviction + PVC 부재라
  # 메모리 포화(OOM 쓰기 실패)나 재기동(uptime 리셋)이 곧 재고·대기열 소실이다.
  # 조기경보 층을 최상단에 두고 그 아래로 메모리·서버 RED·클라이언트(lettuce) RED·연결·키스페이스·도메인 연계를 배치.
  # lettuce는 요약형 타이머(버킷 없음)라 퍼센타일 불가 — 평균/최대만. scrape 30초라 rate 윈도우는 최소 2분(기본 5분).
