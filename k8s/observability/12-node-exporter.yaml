# 노드 PSI(Pressure Stall Information) 전용 node-exporter DaemonSet.
#
# 왜 필요한가: kubectl top / cAdvisor가 보여주는 건 "자원을 쓴 시간"(사용률)뿐이라
# "자원을 못 얻어 멈춰 있던 시간"(포화)을 못 잡는다. 실측에서 노드 CPU 사용률 32%일 때
# /proc/pressure/cpu 의 some avg10 이 96%였다 — 코어 2개에 실행 가능 스레드가 몰려
# 런큐 대기가 심한 상태다. 사용률만 보면 "여유 있음"으로 오판하고 커넥션풀·스레드풀을
# 더 키우는 잘못된 처방으로 간다. 그 판정을 대시보드에서 바로 하려고 들인다.
#
# 왜 최소 구성인가: 노드 두 대 모두 메모리가 빡빡하다(한 대는 사용률 95%, 다른 한 대는
# 요청 기준 93% 할당). 과거에 "노드 수집기"는 바로 이 자원 사유로 도입을 컷했던 항목이다.
# 그래서 --collector.disable-defaults 로 전 컬렉터를 끄고 pressure 하나만 켠다.
# filesystem/netdev/diskstats/meminfo/cpu/textfile 등 기본 컬렉터가 내는 수백 시리즈가
# 전부 사라지고, 노드당 노출 시리즈가 한 자릿수로 떨어진다.
# 남은 사각지대(MemAvailable, 디스크·네트워크)는 이 안건 범위 밖이며, 필요해지면
# meminfo 컬렉터만 추가로 켜는 식으로 증분 확장한다.
#
# 배포 직후 검증 절차와 롤백 방법: README-node-exporter.md.
# 이 워크로드는 자동동기화(prune·selfHeal) 대상이라 클러스터에서 손으로 지워도 되살아난다 —
# 되돌리려면 리버트 커밋이 필요하다.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: observability
spec:
  selector:
    matchLabels: { app: node-exporter }
  updateStrategy:
    type: RollingUpdate
    # 노드 여유가 없어 신규 파드가 Pending으로 막히는 사고를 피한다(20-prometheus.yaml의
    # maxSurge:0과 같은 취지). DaemonSet은 maxSurge 기본이 0이라 구파드가 먼저 내려간다.
    rollingUpdate: { maxUnavailable: 1 }
  template:
    metadata:
      labels: { app: node-exporter }
      # prometheus.io/scrape 어노테이션을 일부러 붙이지 않는다.
      # 이 파드는 otel-collector의 전용 잡(node-exporter)이 파드 라벨로 직접 발견한다.
      # 어노테이션을 붙이면 공용 kubernetes-pods 잡에도 걸려 이중 스크레이프가 된다.
      # 근거 상세는 config/otel-collector.yaml 의 node-exporter 잡 주석 참조.
    spec:
      # PSI는 노드마다 다르므로 전 노드에 떠야 한다. observability 전용 노드에 걸린
      # dedicated=observability:NoSchedule 을 포함해 모든 테인트를 허용한다.
      tolerations:
        - operator: Exists
      # 파드 하드닝 — 비루트 고정. /proc/pressure/{cpu,io,memory}는 0444(world-readable)라
      # 루트 없이 읽힌다. node-exporter 이미지 기본 USER도 nobody(65534)다.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      # hostNetwork/hostPID는 쓰지 않는다. pressure 컬렉터는 호스트 /proc/pressure 마운트만
      # 있으면 되고, hostNetwork를 켜면 노드의 9100 포트를 점유해 충돌 위험만 생긴다.
      # 파드 IP:9100으로 스크레이프하며 NetworkPolicy(observability-intra-only)의
      # 네임스페이스 내부 전면허용으로 otel-collector에서 도달한다.
      containers:
        - name: node-exporter
          image: quay.io/prometheus/node-exporter:v1.9.1
          args:
            # 전 컬렉터 비활성화 후 pressure 하나만 활성. 이 조합이 메모리·시리즈 절감의 핵심.
            - --collector.disable-defaults
            - --collector.pressure
            # go_*/process_*/promhttp_* 자기관측 메트릭도 노출하지 않는다(수십 시리즈 추가 절감).
            - --web.disable-exporter-metrics
            - --path.procfs=/host/proc
            - --web.listen-address=:9100
          env:
            # Go 런타임이 limit(64Mi)에 닿기 전에 스스로 GC하도록. 20-prometheus.yaml과 같은 패턴.
            - { name: GOMEMLIMIT, value: "48MiB" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          ports: [{ containerPort: 9100, name: metrics }]
          readinessProbe:
            httpGet: { path: /metrics, port: 9100 }
            periodSeconds: 30
            failureThreshold: 3
          resources:
            # 컬렉터 1개짜리 node-exporter의 실사용은 Go 런타임 베이스라인 수준(약 10~15Mi).
            # requests 24Mi는 실사용보다 넉넉해 kubelet의 메모리 압박 축출 순위(사용량 −
            # requests 초과분 기준)에서 뒤로 밀린다 — 압박을 관측해야 할 에이전트가 압박 때
            # 먼저 죽는 걸 막는다. 그러면서 노드당 24Mi만 점유해 93% 할당 노드에도 들어간다.
            # limits 64Mi는 목표치가 아니라 폭주 시 크래시 가드다(예상치의 4배 이상).
            # CPU limit은 두지 않는다(20-prometheus.yaml과 동일 관행) — 30초 주기로 파일 3개
            # 읽는 작업에 스로틀이 걸려 스크레이프가 타임아웃되는 편이 손해가 크다.
            limits: { memory: "64Mi" }
            requests: { cpu: "10m", memory: "24Mi" }
          volumeMounts:
            # 순서가 의미를 갖는다 — 부모(/host/proc)가 먼저 걸려야 그 위에 자식
            # (/host/proc/pressure)이 얹힌다. 런타임은 이 배열 순서대로 마운트하며,
            # 경로 길이로 정렬하는 런타임에서도 짧은 쪽이 먼저라 결과는 같다.
            - { name: procfs-root, mountPath: /host/proc }
            - { name: proc-pressure, mountPath: /host/proc/pressure, readOnly: true }
      volumes:
        # 호스트 /proc 전체를 넣지 않는다. --path.procfs 가 가리키는 루트는 빈 디렉터리이고,
        # 실제 데이터는 그 아래 pressure 한 곳에만 얹는다.
        #
        # 왜 이 구성이 성립하는가 — 추정이 아니라 v1.9.1이 고정한 소스를 확인한 결과다.
        #  1) 읽는 경로가 pressure 하나뿐이다. procfs(v0.15.x)의 PSIStatsForResource는 경로를
        #     "<path.procfs>/pressure/<resource>" 로만 조립하고, resource는 cpu·io·memory·irq다.
        #     --collector.disable-defaults 로 나머지 컬렉터가 전부 꺼져 있어 /proc의 다른 곳을
        #     읽는 코드 경로 자체가 없다(자기관측 메트릭도 --web.disable-exporter-metrics로 차단).
        #  2) 기동 시 procfs.NewFS(<path.procfs>)가 도는데, 이 검증은 os.Stat + IsDir 두 가지뿐이다.
        #     statfs 매직으로 "진짜 procfs인가"를 보지 않는다(procfs internal/fs/fs.go). 그래서
        #     루트가 빈 emptyDir여도 초기화가 깨지지 않는다 — 여기가 좁히기의 성패를 가르는 지점이라
        #     매직 검증 유무를 소스로 직접 확인했다.
        #
        # 얻는 것: 호스트의 프로세스 목록(/proc/<pid>/*)·네트워크 상태(/proc/net/*)·커널 파라미터가
        # 컨테이너에 아예 보이지 않는다. exporter가 침해돼도 노출면이 pressure 파일 3~4개다.
        # readOnly 마운트는 "못 바꾼다"만 보장하지 "못 본다"는 보장하지 않으므로 범위 축소가 본질이다.
        #
        # 배포 후 이 구성이 실제로 뜨는지 확인하는 절차는 README-node-exporter.md 참조.
        # (파드가 CrashLoop면 --path.procfs 초기화 실패이므로 즉시 리버트 대상)
        - name: procfs-root
          # 읽기전용으로 잡지 않는다 — 그 위에 자식 마운트를 얹으려면 런타임이 마운트 지점
          # 디렉터리를 만들 수 있어야 한다. 내용물은 pressure 마운트 하나가 전부다.
          emptyDir: {}
        - name: proc-pressure
          # 파일 단위(/proc/pressure/cpu 등)로 고정하지 않고 디렉터리째 건다. irq는 커널 6.1+
          # 에서만 존재해 파일 단위로 박으면 없는 노드에서 hostPath type 검증이 실패한다.
          hostPath: { path: /proc/pressure, type: Directory }
