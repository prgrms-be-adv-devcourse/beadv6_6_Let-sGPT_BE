spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${MEMBER_JWKS_URI:http://member:9100/auth/jwks}
  kafka:
    bootstrap-servers: ${KAFKA_BROKER}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}


services:
  internal:
    timeout: ${INTERNAL_API_TIMEOUT:2000ms}
  order:
    url: http://order:9120
  member:
    url: http://member:9100
  product:
    url: http://product:9110
  search:
    url: http://search:9240
    timeout: ${SEARCH_SERVICE_TIMEOUT:2500ms}
    recommendation-size: ${SEARCH_RECOMMENDATION_SIZE:20}
