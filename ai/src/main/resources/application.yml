server:
  port: 9160
  tomcat:
    mbeanregistry:
      enabled: true   # tomcat_threads_* 메트릭(Micrometer TomcatMetrics) 노출에 필요
    # 가상 스레드를 켜면 요청당 워커가 무한정 생겨 server.tomcat.threads.max가 무의미해진다.
    # 소켓 수용 자체를 막는 최소한의 방벽으로 커넥션 수를 제한한다(수락 단계 과부하 차단).
    max-connections: ${SERVER_TOMCAT_MAX_CONNECTIONS:1024}

spring:
  threads:
    virtual:
      # 요청 처리를 가상 스레드로. WebFlux 대신 선택(벤치 결과 동등 효과, 비용은 훨씬 낮음).
      enabled: true
  kafka:
    consumer:
      group-id: ai-service
      auto-offset-reset: latest
    listener:
      # 소비 리스너에 Observation을 켜 레코드에 실려온 traceparent를 읽고 소비 스팬을 producer
      # 트레이스의 자식으로 잇는다. KafkaConsumerConfig가 리스너 컨테이너 팩토리를 직접 등록하므로
      # 이 값을 그 빈에서 읽어 컨테이너 프로퍼티에 적용한다.
      observation-enabled: true
  profiles:
    active: local
  application:
    name: ai-service
  ai:
    model:
      chat: openai
    openai:
      base-url: ${CHAT_ADMIN_INFERENCE_BASE_URL:${CHAT_INFERENCE_BASE_URL:http://127.0.0.1:11434/v1}}
      api-key: ${CHAT_INFERENCE_API_KEY:${OPENAI_API_KEY:local-inference}}
      timeout: ${CHAT_INFERENCE_STAGE_TIMEOUT:55s}
      max-retries: 0
      chat:
        model: ${CHAT_ADMIN_INFERENCE_MODEL:${CHAT_INFERENCE_MODEL:gemma4:12b-it-qat}}
        max-retries: 0
        max-tokens: ${CHAT_INFERENCE_MAX_TOKENS:1500}
        temperature: 0
        parallel-tool-calls: true
        store: false
    retry:
      max-attempts: 0
    chat:
      client:
        enabled: true
        tool-calling:
          enabled: true
        observations:
          log-prompt: false
          log-completion: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${MEMBER_JWKS_URI:http://localhost:9100/auth/jwks}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: ai
        format_sql: false
        show_sql: false
        jdbc:
          time_zone: Asia/Seoul

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

chat:
  data:
    enabled: ${CHAT_DATA_ENABLED:false}
    url: ${AI_QUERY_DB_URL:}
    username: ${AI_QUERY_DB_USERNAME:ai_query_app}
    password: ${AI_QUERY_DB_PASSWORD:}
  stream:
    deadline: ${CHAT_STREAM_DEADLINE:170s}
    emitter-timeout: ${CHAT_STREAM_EMITTER_TIMEOUT:180s}
    heartbeat-interval: ${CHAT_STREAM_HEARTBEAT_INTERVAL:15s}
  inference:
    enabled: ${CHAT_INFERENCE_ENABLED:true}
    base-url: ${CHAT_ADMIN_INFERENCE_BASE_URL:${CHAT_INFERENCE_BASE_URL:http://127.0.0.1:11434/v1}}
    model: ${CHAT_ADMIN_INFERENCE_MODEL:${CHAT_INFERENCE_MODEL:gemma4:12b-it-qat}}
    local-only-route: ${CHAT_INFERENCE_LOCAL_ONLY_ROUTE:false}
    reasoning-effort: ${CHAT_INFERENCE_REASONING_EFFORT:none}
    stage-timeout: ${CHAT_INFERENCE_STAGE_TIMEOUT:55s}
    routing-max-tokens: ${CHAT_INFERENCE_ROUTING_MAX_TOKENS:700}
    binding-max-tokens: ${CHAT_INFERENCE_BINDING_MAX_TOKENS:1400}
    answer-max-tokens: ${CHAT_INFERENCE_ANSWER_MAX_TOKENS:1500}
    context:
      input-token-limit: ${CHAT_INFERENCE_INPUT_TOKEN_LIMIT:6000}
      answer-token-reserve: ${CHAT_INFERENCE_ANSWER_TOKEN_RESERVE:1500}
      safety-token-reserve: ${CHAT_INFERENCE_SAFETY_TOKEN_RESERVE:692}
      context-window-token-limit: ${CHAT_INFERENCE_CONTEXT_WINDOW_TOKEN_LIMIT:8192}
      max-schema-shards: ${CHAT_INFERENCE_MAX_SCHEMA_SHARDS:6}
      previous-question-max-characters: 300
      previous-answer-max-characters: 800
  weather:
    enabled: ${CHAT_WEATHER_ENABLED:true}
    connect-timeout: ${CHAT_WEATHER_CONNECT_TIMEOUT:2s}
    read-timeout: ${CHAT_WEATHER_READ_TIMEOUT:5s}
  crypto-price:
    enabled: ${CHAT_CRYPTO_PRICE_ENABLED:true}
    connect-timeout: ${CHAT_CRYPTO_PRICE_CONNECT_TIMEOUT:2s}
    read-timeout: ${CHAT_CRYPTO_PRICE_READ_TIMEOUT:5s}
  web-search:
    enabled: ${CHAT_WEB_SEARCH_ENABLED:true}
    api-key: ${TAVILY_API_KEY:}
    connect-timeout: ${CHAT_WEB_SEARCH_CONNECT_TIMEOUT:2s}
    read-timeout: ${CHAT_WEB_SEARCH_READ_TIMEOUT:5s}

# k8s probe + Prometheus 메트릭
management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9161}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    export:
      otlp:
        enabled: false


inference:
  base-url: ${INFERENCE_BASE_URL:https://api.openai.com/v1}
  api-key: ${INFERENCE_API_KEY:${OPENAI_API_KEY:}}
  model: ${INFERENCE_MODEL:gpt-4.1-nano}
  # 실측 n=2000 gpt-4.1-nano: p50 0.8s·p95 1.5s·>3s 2.2% — 3s면 97.8%가 개인화, 나머지는 즉시 폴백
  timeout: ${INFERENCE_LLM_TIMEOUT:3000ms}

recommendation:
  kafka:
    topic:
      order-completed: order.completed.events
      wishlist-changed: wishlist.changed.events
  fallback-limit: ${RECOMMENDATION_FALLBACK_LIMIT:4}
  # 캐시 미스(검색+LLM) 동시 실행 상한, 초과분은 즉시 폴백. server.tomcat.threads.max(50) 미만 필수 —
  # 이상이면 요청 스레드가 먼저 말라 이 밸브가 죽고 초과분이 accept 큐에 쌓인다(실측 90/s p95 7.7s).
  # 40은 남은 스레드를 캐시 히트(~10ms)·헬스체크에 남기려는 값이다.
  max-concurrent-pipelines: ${RECOMMENDATION_MAX_CONCURRENT_PIPELINES:40}
  search:
    # 시드를 나눠 검색을 부르는 최대 횟수. 요청당 검색 호출이 이 배까지 늘고 size는 이만큼 쪼개진다.
    max-groups: ${RECOMMENDATION_SEARCH_MAX_GROUPS:5}
    # 그룹당 요청 배수 — 인접 시드의 KNN이 겹쳐 중복 제거 후 후보가 마르는 것을 메운다. 호출 횟수·LLM 입력은 불변.
    overfetch: ${RECOMMENDATION_SEARCH_OVERFETCH:3}
    # Redis 기반 permit으로 세는 클러스터 전역 검색 동시 호출 상한 — 파드 수와 무관하게 전체에서 이 값을 넘지 않는다.
    max-concurrency: ${RECOMMENDATION_SEARCH_MAX_CONCURRENCY:20}
    # 클러스터 전역 permit 대기 최대 시간. 넘기면 이 호출만 실패시켜 폴백으로 넘긴다. 검색 읽기 타임아웃과 정합.
    acquire-timeout: ${RECOMMENDATION_SEARCH_ACQUIRE_TIMEOUT:2500ms}
    # permit의 최대 생존 시간 — 검색 읽기 타임아웃(2.5s)보다 넉넉해야 한다. 인스턴스가 release 없이
    # 죽어도 이 시간이 지나면 다음 acquire에서 자동 청소된다.
    permit-ttl: ${RECOMMENDATION_SEARCH_PERMIT_TTL:5s}
  drop-cache:
    page-size: ${RECOMMENDATION_DROP_CACHE_PAGE_SIZE:100}
    refresh-interval: ${RECOMMENDATION_DROP_CACHE_REFRESH_INTERVAL:5m}
  # 최후 폴백(드롭 무관 최신 상품, 상세 전용) 개수. fallback-limit과 같아야 같은 화면에서 개수가 맞다.
  last-resort:
    size: ${RECOMMENDATION_LAST_RESORT_SIZE:4}
  # 열린 드롭 상품의 DETAIL 추천을 미리 계산해 캐시를 데운다. LLM 비용이 있으므로 기본 비활성.
  prebatch:
    enabled: ${RECOMMENDATION_PREBATCH_ENABLED:false}
    interval: ${RECOMMENDATION_PREBATCH_INTERVAL:6h}
    initial-delay: ${RECOMMENDATION_PREBATCH_INITIAL_DELAY:1m}
  weights:
    # 한쪽 신호만으로 만든 시드의 TTL. 절반이 낡았으므로 완전 데이터의 24h를 물려주지 않고 짧게 둔다.
    partial-ttl: ${RECOMMENDATION_WEIGHTS_PARTIAL_TTL:10m}
    # 살려 쓴 시드의 연령 상한. 완전 데이터였다면 살아 있었을 FULL_TTL과 같은 24h를 넘으면 버린다.
    salvage-max-age: ${RECOMMENDATION_WEIGHTS_SALVAGE_MAX_AGE:24h}
    wishlist-score: ${RECOMMENDATION_WISHLIST_SCORE:0.3}
    purchase-base-score: ${RECOMMENDATION_PURCHASE_BASE_SCORE:0.5}
    purchase-increment: ${RECOMMENDATION_PURCHASE_INCREMENT:0.1}
    purchase-max-score: ${RECOMMENDATION_PURCHASE_MAX_SCORE:0.85}
    purchase-limit: ${RECOMMENDATION_PURCHASE_LIMIT:20}
    wishlist-limit: ${RECOMMENDATION_WISHLIST_LIMIT:20}
